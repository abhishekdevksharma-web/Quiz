<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Button State</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #7e22ce;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled {
            background-color: gray;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <button id="fetchBtn" onclick="startProcess()">Start Quiz</button>

    <script>
        async function startProcess() {
            let btn = document.getElementById("fetchBtn");

            try {
                // Step 1: Name Store karne ka request bhejo
                btn.innerHTML = "Adding...";
                btn.disabled = true;

                let nameResponse = await fetch("http://localhost:5000/addUser", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: "Abhishek" }) 
                });

                let nameData = await nameResponse.json();
                console.log("User Added:", nameData);

                // Step 2: Name successfully store hone ke baad, quiz fetch karna start karo
                btn.innerHTML = "Fetching Quiz...";

                let quizResponse = await fetch("http://localhost:5000/getQuiz");
                let quizData = await quizResponse.json();
                console.log("Quiz Data:", quizData);

                // Step 3: Data load hone ke baad button update karo
                btn.innerHTML = "✔ Quiz Loaded!";
            } catch (error) {
                console.error("Error:", error);
                btn.innerHTML = "❌ Retry";
            }

            // Step 4: 3 sec baad button reset kar do
            setTimeout(() => {
                btn.innerHTML = "Start Quiz";
                btn.disabled = false;
            }, 3000);
        }
    </script>

</body>
</html>
