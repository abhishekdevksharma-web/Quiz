            Dark Mode
          </span>

    <div id="main" class="main">
      <div class="loader-container" id="loaderContainer">
        <div class="loader"></div>
      </div>
      <div class="appcontainermain" id="appcontainermain">
        <div class="app-container" id="app-container">
          <!-- Enhanced header with better layout for Quiz Name and Quiz Subject -->
          <div class="header">

            <button class="publish-btn" id="publishBtn">
              Publish
            </button>
          </div>

          <div class="form-container">
            <fieldset
              style="padding-inline-end: 30px; padding-inline-start: 20px; box-sizing: border-box; border: 1px solid black; border-radius: 7px; margin-bottom: 10px; display: flex;justify-content: space-between;">
              <legend style="font-family: poppins;letter-spacing: 0.5;">This Fild Also Required</legend>
              <input type="text" id="quizName" name="quizName" placeholder="Enter quiz name..."
                style="border: none; border-radius: 0; width: 250px; background: white;  border-bottom: 2px solid #000000; color: #000000; font-size: 16px; padding: 4px 16px; outline: none; transition: border-color 0.3s;"
                required form="myform">
              <!-- Quiz Subject Input -->
              <input type="text" id="quizSubject" name="quizSubject" placeholder="Enter quiz subject..."
                style="border-radius: 0; width: 250px; background: white; border: none; border-bottom: 2px solid #007BFF; color: #000000; font-size: 16px; padding: 4px 16px; outline: none; transition: border-color 0.3s; margin-left: 20px;"
                required form="myform">
            </fieldset>
            <!-- Container for multiple question cards -->
            <div id="questionsContainer"></div>
            <div class="global-actions">
              <button class="btn-add-question" onclick="addQuestion()">+ Add New Question</button>
            </div>
          </div>

          <!-- Modal Popup for displaying result -->
          <div class="modal" id="popupModal">
            <div class="modal-content">
              <span class="close-modal" id="closeModal">&times;</span>
              <p id="modalMessage"></p>
            </div>
          </div>

          <!-- Template for a new question card -->
          <template id="questionTemplate">
            <div class="question-card">
              <h2>Create Your Question</h2>
              <form id="myform" class="question-form">
                <div class="form-group">
                  <label>Question Text</label>
                  <input type="text" name="question" required placeholder="Enter your question here...">
                </div>
                <div class="options-container">
                  <div class="option">
                    <input type="radio" class="option-radio">
                    <input type="text" name="option[]" placeholder="Option 1" required>
                    <button type="button" class="remove-option" onclick="removeOption(this)">×</button>
                  </div>
                  <div class="option">
                    <input type="radio" class="option-radio">
                    <input type="text" name="option[]" placeholder="Option 2" required>
                    <button type="button" class="remove-option" onclick="removeOption(this)">×</button>
                  </div>
                </div>
                <div class="actions">
                  <button type="button" class="btn btn-secondary" onclick="addOption(this)">+ Add Option</button>
                </div>
              </form>
              <div class="actions" style="justify-content: flex-end; margin-top: 1rem;">
                <button type="button" class="btn btn-secondary" onclick="removeQuestion(this)">Remove Question</button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="history-container" id="history-container">
        <!-- <div class="quiz-entry" id="quizEntry1">
          
        </div> -->
      </div>
    </div>
    <div id="Terminal"><span style="color: white;">Terminal</span>
      <div id="output"></div>
      <div id="input-line">
        <span id="prompt">$</span>
      </div>
    </div>
