    <div class="quiz-card" id="quiz-card">
        <!-- Loading Overlay -->
        <div class="loader-overlay" id="loader">
            <div class="loader"></div>
        </div>

        <!-- Quiz Content -->
        <div class="quiz-content" id="content">
            <div class="quiz-header">
                <h1 class="quiz-title" id="quiz-title">Quick Knowledge Test</h1>
                <div class="quiz-subject" id="quiz-subject">General Awareness</div>
            </div>

            <div class="quiz-details">
                <div class="detail-item">
                    <div class="detail-label">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                        </svg>
                        Total Questions
                    </div>
                    <div class="detail-value" id="total-questions">15</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">
                        <svg viewBox="0 0 24 24">
                            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                        </svg>
                        Duration
                    </div>
                    <div class="detail-value" id="duration">10 mins</div>
                </div>
            </div>

            <button class="black-button" id="rippleBtn">CLICK ME</button>
        </div>
    </div>
