<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }

        .form-container {
            background: white;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }

        .form-container h2 {
            margin-bottom: 15px;
            color: #7e22ce;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #7e22ce;
            outline: none;
            box-shadow: 0 0 5px rgba(126, 34, 206, 0.5);
        }

        button {
            width: 100%;
            padding: 10px;
            background: #7e22ce;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #6518b4;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Login</h2>
        <form action="/adminSign" method="POST">
            <input type="text" name="AFN" placeholder="Enter Name" required />
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
