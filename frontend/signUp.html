<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container */
    .signup-container {
      background: white;
      width: 400px;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .signup-container h1 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      color: #2c3e50;
      font-weight: 600;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #34495e;
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      background-color: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      color: #2c3e50;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      background-color: white;
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
      outline: none;
    }

    /* Password Strength Indicator */
    .password-strength {
      height: 4px;
      background: #eee;
      margin: 0.5rem 0;
      border-radius: 2px;
      position: relative;
    }

    .strength-bar {
      height: 100%;
      width: 0;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* Signup Button */
    .signup-button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4a90e2, #357abd);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 1rem;
    }

    .signup-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
    }

    /* Login Link */
    .login-link {
      margin-top: 1.5rem;
      color: #7f8c8d;
    }

    .login-link a {
      color: #4a90e2;
      text-decoration: none;
      font-weight: 500;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .signup-container {
        width: 90%;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h1>Create Account</h1>

    <form action="/signup" method="post">
        <div class="form-group">
          <label for="username">Fullname</label>
          <input class="input-field" type="text" id="username" name="fullName" placeholder="Enter your username" required>
        </div>
      
        <div class="form-group">
          <label for="email">Email</label>
          <input class="input-field" type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
      
        <div class="form-group">
          <label for="password">Password</label>
          <input class="input-field" type="password" id="password" name="password" placeholder="Create password" required>
          <div class="password-strength">
            <div class="strength-bar"></div>
          </div>
        </div>
      
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input class="input-field" type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" required>
        </div>
      
        <button class="signup-button" type="submit">CREATE ACCOUNT</button>
      </form>
      

    <div class="login-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>

  <script>
    // Password Strength Indicator
    const passwordInput = document.getElementById('password');
    const strengthBar = document.querySelector('.strength-bar');

    passwordInput.addEventListener('input', function() {
      const strength = calculatePasswordStrength(this.value);
      updateStrengthIndicator(strength);
    });

    function calculatePasswordStrength(password) {
      const strength = {
        width: '0%',
        color: '#ff4757'
      };

      if (password.length >= 8) {
        strength.width = '50%';
        strength.color = '#ffa502';
      }
      if (password.length >= 12 || /[!@#$%^&*(),.?":{}|<>]/.test(password)) {
        strength.width = '100%';
        strength.color = '#2ed573';
      }

      return strength;
    }

    function updateStrengthIndicator(strength) {
      strengthBar.style.width = strength.width;
      strengthBar.style.backgroundColor = strength.color;
    }

  </script>
</body>
</html>
